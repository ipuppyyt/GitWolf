name: Release

# Pushing a tag like v1.0.0 builds, signs and publishes GitWolf for macOS and then Windows, and updates the
# feeds that the in-app updaters read. The Mac app is signed with a Developer ID certificate and notarised by
# Apple (see docs/RELEASING.md). Repository secrets:
#   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application" certificate with its key (.p12)
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   NOTARY_KEY_P8               base64 of the App Store Connect API key (.p8) used to notarise
#   NOTARY_KEY_ID               that key's ID
#   NOTARY_ISSUER_ID            the issuer ID shown on the App Store Connect keys page
#   GITWOLF_UPDATE_KEY          the private update-signing key (gitwolf-release keys export)
# The feed is served by GitHub Pages from the gh-pages branch.
# Optional, to Authenticode-sign the Windows program (the release is unsigned without them):
#   WINDOWS_CERTIFICATE_PFX       base64 of a code-signing certificate (.pfx) for Windows
#   WINDOWS_CERTIFICATE_PASSWORD  password of that .pfx
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Test
        working-directory: apple
        run: swift test
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # `security -i` reads commands from stdin, so no password appears in a process argument list.
          security -i <<EOS
          create-keychain -p "$KCPASS" "$KC"
          set-keychain-settings -lut 3600 "$KC"
          unlock-keychain -p "$KCPASS" "$KC"
          import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC"
          list-keychains -d user -s "$KC" login.keychain-db
          default-keychain -d user -s "$KC"
          EOS
          rm "$RUNNER_TEMP/cert.p12"
          # Apple's intermediate certificate, so the Developer ID identity is valid and notarytool finds its profile.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/devid-g2.cer"
          security import "$RUNNER_TEMP/devid-g2.cer" -k "$KC" || true
          security find-identity -v -p codesigning
          # `security -i` succeeds even when an import inside it failed (for example a wrong .p12 password), so check.
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application: Nidhin M (4Y59G32M97)"; then
            echo "::error::The Developer ID identity is not in the build keychain. Check that MACOS_CERTIFICATE_P12 is the Developer ID .p12 (exported with its private key) and that MACOS_CERTIFICATE_PASSWORD is the password chosen when exporting it."
            exit 1
          fi
      - name: Store notarisation credentials
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # The key goes to a temporary file that is removed straight away; the profile lives in the build keychain.
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials gitwolf-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$RUNNER_TEMP/release.keychain-db"
          rm "$RUNNER_TEMP/notary.p8"
      - name: Previous feed and release notes
        run: |
          git fetch origin gh-pages 2>/dev/null && git show origin/gh-pages:appcast.xml > "$RUNNER_TEMP/previous-appcast.xml" || : > "$RUNNER_TEMP/previous-appcast.xml"
          VERSION="${GITHUB_REF_NAME#v}"
          # This version's section of the changelog, if there is one.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
      - name: Build, sign, package
        working-directory: apple
        env:
          SIGN_IDENTITY: "Developer ID Application: Nidhin M (4Y59G32M97)"
          NOTARY_PROFILE: gitwolf-notary
          GITWOLF_UPDATE_KEY: ${{ secrets.GITWOLF_UPDATE_KEY }}
          PREVIOUS_APPCAST: ${{ runner.temp }}/previous-appcast.xml
          RELEASE_NOTES: ${{ runner.temp }}/notes.md
        run: Scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Homebrew cask
        run: apple/Scripts/make-cask.sh "${GITHUB_REF_NAME#v}" apple/build/release > apple/build/release/gitwolf.rb
      - name: Release page text
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          {
            echo "## Download"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| macOS 15 or later | \`GitWolf-$VERSION.dmg\` |"
            echo "| Windows 10 or 11 (x64) | \`GitWolf-$VERSION-windows-x64-setup.exe\` |"
            echo "| Windows, portable | \`GitWolf-$VERSION-windows-x64.zip\` |"
            echo "| Homebrew | \`brew install --cask ipuppyyt/gitwolf/gitwolf\` |"
            echo
            echo "Installed copies update from inside the app. SHA-256 checksums are the \`.sha256\` files below."
            echo
            echo "## What's new"
            echo
            cat "$RUNNER_TEMP/notes.md"
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${GITHUB_REF_NAME}"
            fi
          } > "$RUNNER_TEMP/release-body.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apple/build/release/GitWolf-*.zip apple/build/release/GitWolf-*.dmg apple/build/release/GitWolf-*.sha256 apple/build/release/gitwolf.rb --notes-file "$RUNNER_TEMP/release-body.md" --title "GitWolf ${GITHUB_REF_NAME#v}"
      # Optional: keeps the Homebrew tap (a repository named homebrew-gitwolf) current. Skipped without the secret.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-gitwolf.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp apple/build/release/gitwolf.rb "$RUNNER_TEMP/tap/Casks/gitwolf.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gitwolf.rb
          git diff --cached --quiet || { git commit -m "gitwolf ${GITHUB_REF_NAME#v}"; git push; }
      - name: Publish the update feed
        run: |
          cp apple/build/release/appcast.xml "$RUNNER_TEMP/appcast.xml"
          cp -R site "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git switch -C gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          # Drop build output left in the checkout so `git add -A` can't publish it.
          git clean -fdxq
          # The Windows job keeps its own feed on this branch.
          git rm -rfq --ignore-unmatch -- . ':(exclude)appcast-windows.xml' || true
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          # The website (site/) is served from the same branch.
          cp -R "$RUNNER_TEMP/site/." .
          touch .nojekyll
          git add -A
          git commit -m "Update the feed for $GITHUB_REF_NAME"
          git push origin gh-pages

  windows:
    # After macOS, which creates the release and the gh-pages branch.
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Check the version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The tag must look like v1.2.3"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        working-directory: windows
        run: dotnet test tests/GitWolfCore.Tests/GitWolfCore.Tests.csproj --nologo --blame-hang-timeout 5m
      # The WinUI app needs the MSBuild that ships with Visual Studio.
      - name: Build and package
        working-directory: windows
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found' }
          $out = Join-Path $env:RUNNER_TEMP 'app'
          & $msbuild src\GitWolf.App\GitWolf.App.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true "-p:Version=$env:VERSION" -p:GitWolfUpdates=true -t:Publish "-p:PublishDir=$env:RUNNER_TEMP\publish\" -v:minimal -nologo
          if ($LASTEXITCODE -ne 0) { throw 'The build failed' }
          Copy-Item src\GitWolf.App\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64 $out -Recurse
          # Only publishing compiles ahead of time, but its folder lacks the interface files of an
          # unpackaged WinUI app. So the build is shipped, with the published libraries over it.
          Copy-Item "$env:RUNNER_TEMP\publish\*.dll" $out -Force
          Get-ChildItem $out -Recurse -Filter *.pdb | Remove-Item
          # Most runner images include Inno Setup; the pinned package covers one that doesn't.
          $findInno = { Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue }
          $iscc = & $findInno
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup could not be installed' }
            $iscc = & $findInno
          }
          if (-not $iscc) { throw 'Inno Setup was not found' }
          $setup = Join-Path $env:RUNNER_TEMP "GitWolf-$env:VERSION-windows-x64-setup.exe"
          function Build-Installer {
            & $iscc.FullName /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$out" "/DOutputDir=$env:RUNNER_TEMP" installer\GitWolf.iss
            if ($LASTEXITCODE -ne 0) { throw 'The installer failed to build' }
          }
          if ($env:CERT_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
            $certificate = $null
            try {
              # Imported into the store, so the password never appears on a command line.
              $password = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
                Where-Object HasPrivateKey | Select-Object -First 1
              if (-not $certificate) { throw 'The certificate has no private key' }
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                Sort-Object FullName | Select-Object -Last 1
              if (-not $signtool) { throw 'signtool was not found' }
              $files = 'GitWolf.App.exe', 'GitWolf.App.dll', 'GitWolf.Store.dll', 'GitWolfCore.dll' |
                ForEach-Object { Join-Path $out $_ }
              & $signtool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
              if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }
              # Built from the signed files, then signed itself.
              Build-Installer
              & $signtool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
              if ($LASTEXITCODE -ne 0) { throw 'Signing the installer failed' }
            }
            finally {
              Remove-Item $pfx
              if ($certificate) { Remove-Item $certificate.PSPath -DeleteKey }
            }
          }
          else {
            Write-Output '::warning::No Windows certificate is configured, so the app is not code signed.'
            Build-Installer
          }
          $zip = Join-Path $env:RUNNER_TEMP "GitWolf-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip
          foreach ($file in $zip, $setup) {
            (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() + "  $(Split-Path $file -Leaf)" |
              Set-Content "$file.sha256" -Encoding ascii
          }
          dotnet build tools\GitWolf.Release\GitWolf.Release.csproj -c Release --nologo -o (Join-Path $env:RUNNER_TEMP 'tool')
          if ($LASTEXITCODE -ne 0) { throw 'The release tool failed to build' }
      - name: Sign and write the update feed
        shell: bash
        env:
          GITWOLF_UPDATE_KEY: ${{ secrets.GITWOLF_UPDATE_KEY }}
        run: |
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          ZIP="GitWolf-$VERSION-windows-x64.zip"
          # This version's section of the changelog, if there is one.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$TEMP_DIR/notes.md"
          git config core.autocrlf false
          git fetch origin gh-pages
          git worktree add --detach "$TEMP_DIR/pages" FETCH_HEAD
          dotnet "$TEMP_DIR/tool/GitWolf.Release.dll" "$TEMP_DIR/$ZIP" "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ZIP" \
            "$TEMP_DIR/pages/appcast-windows.xml" "$TEMP_DIR/notes.md" "$TEMP_DIR/pages/appcast-windows.xml"
      # The archive is uploaded before the feed that points to it. The installer is for first installs only.
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          ZIP="$TEMP_DIR/GitWolf-$VERSION-windows-x64.zip"
          SETUP="$TEMP_DIR/GitWolf-$VERSION-windows-x64-setup.exe"
          gh release upload "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" "$SETUP" "$SETUP.sha256"
      - name: Publish the update feed
        shell: bash
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")/pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast-windows.xml
          git commit -m "Update the Windows feed for $GITHUB_REF_NAME"
          git push origin HEAD:gh-pages
